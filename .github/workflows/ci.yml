name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Deploys are done manually (npm run build && firebase deploy --only hosting,firestore).
permissions:
  contents: read

jobs:
  test_and_build:
    name: 🧪 Vitest Suite & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run Automated Financial & Logic Tests
        run: npm test

      - name: 🏗️ Build Production Bundle
        env:
          VITE_FB_PROJECT_ID: ${{ secrets.VITE_FB_PROJECT_ID || 'trip-e42a4' }}
          VITE_FB_AUTH_DOMAIN: ${{ secrets.VITE_FB_AUTH_DOMAIN || 'trip-e42a4.firebaseapp.com' }}
          VITE_FB_STORAGE_BUCKET: ${{ secrets.VITE_FB_STORAGE_BUCKET || 'trip-e42a4.appspot.com' }}
          VITE_FB_API_KEY: ${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_MESSAGING_SENDER_ID: ${{ secrets.VITE_FB_MESSAGING_SENDER_ID }}
          VITE_FB_APP_ID: ${{ secrets.VITE_FB_APP_ID }}
          VITE_FB_VAPID_KEY: ${{ secrets.VITE_FB_VAPID_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: npm run build
